# This workflow deploys Storybook to GitHub Pages
name: Deploy Storybook to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # Node.js >= 25 Linux binaries link against libatomic (see the Node 26.13.0
      # release notes); same step as scheduleonce/github-workflows pnpm-check.
      - name: Install Node.js system dependency
        run: |
          if ! ldconfig -p 2>/dev/null | grep -q 'libatomic.so.1'; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libatomic1
          fi
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      # pnpm version is read from "packageManager" in package.json.
      # Corepack is not used (no longer shipped with Node.js >= 25).
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./storybook-static"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
